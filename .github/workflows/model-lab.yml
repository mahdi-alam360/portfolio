name: Model Lab validation
on:
  push:
    paths: ['projects/model-lab/**', 'api/model-lab.mjs', '.github/workflows/model-lab.yml']
  pull_request:
    paths: ['projects/model-lab/**', 'api/model-lab.mjs', '.github/workflows/model-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s projects/model-lab -p 'test_*.py'
      - run: node --test projects/model-lab/test_api.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: evaluated-model
          path: projects/model-lab/artifact.json
