name: RoadFrame integration tests
on:
  push:
    paths: ['projects/roadframe/**', '.github/workflows/roadframe.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: dotnet build projects/roadframe/RoadFrame.csproj
      - run: node projects/roadframe/tests/integration.mjs
